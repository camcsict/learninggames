<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Interactive Noise Level Megaphone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff2a5f;
            --orange: #ff7d00;
            --green: #00e676;
            --purple: #bf5af2;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        /* FIT SCREEN WITHOUT SCROLL */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #090d16;
            font-family: 'Fredoka', sans-serif;
            color: #ffffff;
        }

        .app-viewport {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            transition: background 0.5s ease;
        }

        /* CANVAS FOR EMOJI EFFECTS & PARTICLE BURSTS */
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        /* COMPACT HEADER */
        header {
            z-index: 10;
            text-align: center;
            margin-top: 2px;
        }

        .title-banner {
            background: rgba(15, 23, 42, 0.85);
            border: 3px solid rgba(255, 255, 255, 0.2);
            padding: 6px 32px;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            display: inline-block;
            backdrop-filter: blur(8px);
        }

        .title-banner h1 {
            font-size: clamp(1.4rem, 2.2vw, 2.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #38bdf8, #f43f5e, #facc15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        /* CENTERING SVG AREA (AUTO RESPONSIVE) */
        .svg-wrapper {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
            max-height: calc(100vh - 190px);
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
        }

        /* INTERACTIVE SVG ELEMENTS */
        .zone-path {
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center;
        }

        .zone-group:hover .zone-path {
            filter: brightness(1.3) drop-shadow(0 0 15px rgba(255,255,255,0.8));
            opacity: 0.95;
        }

        .zone-group.active .zone-path {
            filter: brightness(1.2) drop-shadow(0 0 25px currentColor);
            stroke: #ffffff !important;
            stroke-width: 5px !important;
        }

        /* INDICATOR ARROW */
        #indicatorArrow {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* SOUND WAVES "OVER" EFFECTS */
        .wave-line {
            transition: all 0.3s ease;
            opacity: 0.1;
            transform-origin: 940px 350px;
        }

        .wave-line.active {
            opacity: 1;
            animation: wavePulse 0.8s infinite alternate ease-in-out;
        }

        /* COMPACT BOTTOM DASHBOARD */
        footer {
            width: 100%;
            max-width: 1100px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .lvl-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 8px 12px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
        }

        .lvl-btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .lvl-btn.active {
            border-color: #ffffff;
            box-shadow: 0 0 20px currentColor;
            transform: translateY(-4px) scale(1.04);
        }

        .lvl-btn .btn-num {
            font-size: 1.3rem;
            font-weight: 900;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lvl-btn .btn-text {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-bar {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 14px;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }

        .status-emoji {
            font-size: 1.6rem;
        }

        .eq-container {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 26px;
        }

        .eq-bar {
            width: 6px;
            border-radius: 3px;
            background: #475569;
            height: 15%;
            transition: height 0.15s ease, background 0.3s ease;
        }

        /* ANIMATIONS FOR OVER LEVELS */
        @keyframes wavePulse {
            0% { stroke-dashoffset: 0; transform: scale(0.96); }
            100% { stroke-dashoffset: 20; transform: scale(1.05); filter: drop-shadow(0 0 15px currentColor); }
        }

        /* SCREEN SHAKE WHEN LEVEL 3 (MAX OVER) IS ON */
        .shake-screen {
            animation: intenseShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes intenseShake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-0.5deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-1deg); }
            40%, 60% { transform: translate3d(6px, 0, 0) rotate(1deg); }
        }

        /* BACKGROUND NEON GLOW PER LEVEL */
        .bg-lvl-0 { background: radial-gradient(circle at center, #2c0b1e 0%, #090d16 100%); }
        .bg-lvl-1 { background: radial-gradient(circle at center, #2e1d0c 0%, #090d16 100%); }
        .bg-lvl-2 { background: radial-gradient(circle at center, #0a2d1e 0%, #090d16 100%); }
        .bg-lvl-3 { background: radial-gradient(circle at center, #350c3d 0%, #090d16 100%); }
    </style>
</head>
<body>

<div class="app-viewport bg-lvl-0" id="app">
    <!-- Overlay Canvas "Over" effects -->
    <canvas id="fxCanvas"></canvas>

    <!-- Title Header -->
    <header>
        <div class="title-banner">
            <h1>📢 NOISE LEVEL MEGAPHONE</h1>
        </div>
    </header>

    <!-- Vector Megaphone SVG Area -->
    <div class="svg-wrapper">
        <svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff2a5f"/><stop offset="100%" stop-color="#d90429"/>
                </linearGradient>
                <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff9f1c"/><stop offset="100%" stop-color="#ff7d00"/>
                </linearGradient>
                <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2ec4b6"/><stop offset="100%" stop-color="#00e676"/>
                </linearGradient>
                <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#e0aaff"/><stop offset="100%" stop-color="#bf5af2"/>
                </linearGradient>

                <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3a86ff"/><stop offset="100%" stop-color="#03045e"/>
                </linearGradient>

                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur"/>
                    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                </filter>
            </defs>

            <!-- Megaphone Handle & Back Rim -->
            <g>
                <path d="M 460 450 L 410 590 C 405 605 420 620 440 620 L 490 620 C 510 620 520 605 515 590 L 485 475 Z" 
                      fill="url(#frameGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                <ellipse cx="940" cy="320" rx="42" ry="195" fill="#03045e" stroke="#ffffff" stroke-width="5"/>
            </g>

            <!-- INTERACTIVE ZONES -->
            
            <!-- LEVEL 0: NO VOICES -->
            <g class="zone-group active" data-level="0" id="zone-0">
                <path class="zone-path" d="M 230 280 L 370 255 A 22 75 0 0 1 370 385 L 230 360 A 15 45 0 0 0 230 280 Z" 
                      fill="url(#redGrad)" stroke="#1e3a8a" stroke-width="3"/>
                <text x="300" y="310" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">NO</text>
                <text x="300" y="332" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">VOICES</text>
                <text x="300" y="358" font-size="20" text-anchor="middle">🤫</text>
            </g>

            <!-- LEVEL 1: BUDDY VOICES -->
            <g class="zone-group" data-level="1" id="zone-1">
                <path class="zone-path" d="M 370 255 L 530 220 A 30 110 0 0 1 530 420 L 370 385 A 22 75 0 0 0 370 255 Z" 
                      fill="url(#orangeGrad)" stroke="#1e3a8a" stroke-width="3"/>
                <text x="450" y="302" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">BUDDY</text>
                <text x="450" y="328" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">VOICES</text>
                <text x="450" y="360" font-size="24" text-anchor="middle">👥</text>
            </g>

            <!-- LEVEL 2: TABLE VOICES -->
            <g class="zone-group" data-level="2" id="zone-2">
                <path class="zone-path" d="M 530 220 L 720 175 A 38 150 0 0 1 720 465 L 530 420 A 30 110 0 0 0 530 220 Z" 
                      fill="url(#greenGrad)" stroke="#1e3a8a" stroke-width="3"/>
                <text x="625" y="298" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">TABLE</text>
                <text x="625" y="328" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">VOICES</text>
                <text x="625" y="365" font-size="28" text-anchor="middle">💬</text>
            </g>

            <!-- LEVEL 3: CLASS VOICES -->
            <g class="zone-group" data-level="3" id="zone-3">
                <path class="zone-path" d="M 720 175 L 940 125 A 45 210 0 0 1 940 515 L 720 465 A 38 150 0 0 0 720 175 Z" 
                      fill="url(#purpleGrad)" stroke="#1e3a8a" stroke-width="3"/>
                <text x="830" y="292" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">CLASS</text>
                <text x="830" y="328" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">VOICES</text>
                <text x="830" y="370" font-size="34" text-anchor="middle">🗣️</text>
            </g>

            <!-- Megaphone Outer Border -->
            <ellipse cx="230" cy="320" rx="16" ry="40" fill="url(#frameGrad)" stroke="#ffffff" stroke-width="4"/>
            <path d="M 230 280 L 940 125 A 45 210 0 0 1 940 515 L 230 360" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

            <!-- DYNAMIC SOUND WAVES (OVER WAVES) -->
            <path id="wave-1" class="wave-line" d="M 990 210 A 160 160 0 0 1 990 430" fill="none" stroke="#ff7d00" stroke-width="10" stroke-linecap="round"/>
            <path id="wave-2" class="wave-line" d="M 1030 170 A 210 210 0 0 1 1030 470" fill="none" stroke="#00e676" stroke-width="12" stroke-linecap="round"/>
            <path id="wave-3" class="wave-line" d="M 1075 130 A 260 260 0 0 1 1075 510" fill="none" stroke="#bf5af2" stroke-width="14" stroke-linecap="round"/>

            <!-- MOVING INDICATOR ARROW (POINTER) -->
            <g id="indicatorArrow" transform="translate(275, 420)">
                <path d="M 10 120 L 10 70 L -12 70 L 25 15 L 62 70 L 40 70 L 40 120 Z" 
                      fill="#f43f5e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)"/>
                <text x="25" y="145" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">LEVEL</text>
            </g>
        </svg>
    </div>

    <!-- Footer Controls (Bottom Control Bar) -->
    <footer>
        <div class="btn-grid">
            <button class="lvl-btn active" style="color: var(--red);" onclick="setLevel(0)">
                <span class="btn-num">0</span>
                <span class="btn-text">SILENT MODE</span>
            </button>
            <button class="lvl-btn" style="color: var(--orange);" onclick="setLevel(1)">
                <span class="btn-num">1</span>
                <span class="btn-text">WHISPER TALK</span>
            </button>
            <button class="lvl-btn" style="color: var(--green);" onclick="setLevel(2)">
                <span class="btn-num">2</span>
                <span class="btn-text">GROUP VOICE</span>
            </button>
            <button class="lvl-btn" style="color: var(--purple);" onclick="setLevel(3)">
                <span class="btn-num">3</span>
                <span class="btn-text">PRESENTER</span>
            </button>
        </div>

        <div class="status-bar">
            <div class="status-info">
                <span id="statusEmoji" class="status-emoji">🤫</span>
                <div>
                    <strong id="statusTitle" style="color: var(--red); font-size: 1.1rem;">LEVEL 0 - SILENT MODE</strong>
                    <p id="statusDesc" style="color: #94a3b8; font-size: 0.9rem;">Absolute silence. No talking in class.</p>
                </div>
            </div>

            <!-- Dynamic Volume Equalizer Bar -->
            <div class="eq-container" id="eqContainer">
                <div class="eq-bar"></div><div class="eq-bar"></div>
                <div class="eq-bar"></div><div class="eq-bar"></div>
                <div class="eq-bar"></div><div class="eq-bar"></div>
                <div class="eq-bar"></div><div class="eq-bar"></div>
            </div>
        </div>
    </footer>
</div>

<script>
    // LEVEL DATA & EFFECTS
    const levels = [
        {
            level: 0,
            title: "LEVEL 0 - SILENT MODE",
            desc: "Absolute silence. No talking in class.",
            color: "var(--red)",
            emoji: "🤫",
            arrowX: 275,
            waves: 0,
            bgClass: "bg-lvl-0",
            particles: ["🤫", "❄️", "✨", "🔒"]
        },
        {
            level: 1,
            title: "LEVEL 1 - WHISPER TALK",
            desc: "Whisper softly. Only the person next to you can hear.",
            color: "var(--orange)",
            emoji: "👥",
            arrowX: 425,
            waves: 1,
            bgClass: "bg-lvl-1",
            particles: ["👥", "💬", "🎵", "🧡"]
        },
        {
            level: 2,
            title: "LEVEL 2 - GROUP VOICE",
            desc: "Group discussion voice. Audible for everyone at your table.",
            color: "var(--green)",
            emoji: "💬",
            arrowX: 600,
            waves: 2,
            bgClass: "bg-lvl-2",
            particles: ["💬", "🟢", "🎶", "👏"]
        },
        {
            level: 3,
            title: "LEVEL 3 - PRESENTER VOICE (MAX OVER)",
            desc: "Presenter voice! Speak clearly and loudly for the whole class.",
            color: "var(--purple)",
            emoji: "🗣️",
            arrowX: 805,
            waves: 3,
            bgClass: "bg-lvl-3",
            particles: ["🗣️", "📢", "💥", "⚡", "🎉", "🔥", "🚀"]
        }
    ];

    let currentLevel = 0;
    let audioCtx = null;

    // WEB AUDIO API - PLAY UNIQUE SOUND EFFECTS FOR EACH LEVEL
    function playSoundEffect(level) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (level === 0) {
                // Soft "Shh" sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            } else if (level === 1) {
                // Warm beep sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            } else if (level === 2) {
                // Cheerful double-tone sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(587, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            } else if (level === 3) {
                // Explosive Fanfare horn sound (OVER)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(659, now + 0.08);
                osc.frequency.setValueAtTime(880, now + 0.18);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            }

            osc.start(now);
            osc.stop(now + 0.5);
        } catch (e) {}
    }

    // CANVAS "OVER" EFFECT (EMOJI EXPLOSION RAIN)
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnParticles(lvl) {
        const conf = levels[lvl];
        const count = lvl === 3 ? 45 : (lvl + 1) * 10; // Level 3 shoots a lot
        const startX = window.innerWidth * 0.75;
        const startY = window.innerHeight * 0.45;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: startX,
                y: startY,
                vx: (Math.random() - 0.2) * (lvl === 3 ? 18 : 10),
                vy: (Math.random() - 0.5) * (lvl === 3 ? 18 : 10),
                size: Math.random() * (lvl === 3 ? 28 : 20) + 16,
                text: conf.particles[Math.floor(Math.random() * conf.particles.length)],
                alpha: 1,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.2
            });
        }
    }

    function renderCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.015;
            p.rot += p.vRot;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.font = `${p.size}px sans-serif`;
            ctx.fillText(p.text, 0, 0);
            ctx.restore();

            if (p.alpha <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(renderCanvas);
    }
    renderCanvas();

    // MAIN LEVEL SWITCH FUNCTION
    function setLevel(lvl) {
        currentLevel = lvl;
        const config = levels[lvl];
        const app = document.getElementById('app');

        // 1. Change Neon Background color
        app.className = `app-viewport ${config.bgClass}`;

        // 2. Shake screen if Level 3 (OVER EFFECT)
        if (lvl === 3) {
            app.classList.add('shake-screen');
            setTimeout(() => app.classList.remove('shake-screen'), 400);
        }

        // 3. Move indicator arrow
        document.getElementById('indicatorArrow').style.transform = `translate(${config.arrowX}px, 420px)`;

        // 4. Update active state on SVG megaphone
        document.querySelectorAll('.zone-group').forEach(el => {
            if (parseInt(el.getAttribute('data-level')) === lvl) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        });

        // 5. Update sound waves
        for (let i = 1; i <= 3; i++) {
            const wave = document.getElementById(`wave-${i}`);
            if (i <= config.waves) {
                wave.classList.add('active');
            } else {
                wave.classList.remove('active');
            }
        }

        // 6. Update footer buttons
        document.querySelectorAll('.lvl-btn').forEach((btn, idx) => {
            if (idx === lvl) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // 7. Update dashboard content
        document.getElementById('statusEmoji').innerText = config.emoji;
        const titleEl = document.getElementById('statusTitle');
        titleEl.innerText = config.title;
        titleEl.style.color = config.color;
        document.getElementById('statusDesc').innerText = config.desc;

        // 8. Spawn Emoji Fireworks & Sound
        spawnParticles(lvl);
        playSoundEffect(lvl);
    }

    // ANIMATION FOR FOOTER EQUALIZER BAR
    setInterval(() => {
        const bars = document.querySelectorAll('.eq-bar');
        const color = levels[currentLevel].color;
        
        bars.forEach(bar => {
            if (currentLevel === 0) {
                bar.style.height = '10%';
            } else {
                const max = currentLevel * 30 + 10;
                const h = Math.floor(Math.random() * max) + 15;
                bar.style.height = `${h}%`;
            }
            bar.style.background = color;
        });
    }, 120);

    // EVENT LISTENER FOR VECTOR MEGAPHONE CLICK
    document.querySelectorAll('.zone-group').forEach(item => {
        item.addEventListener('click', () => {
            setLevel(parseInt(item.getAttribute('data-level')));
        });
    });

    // KEYBOARD SHORTCUTS
    window.addEventListener('keydown', (e) => {
        if (['0', '1', '2', '3'].includes(e.key)) {
            setLevel(parseInt(e.key));
        } else if (e.key === 'ArrowRight' && currentLevel < 3) {
            setLevel(currentLevel + 1);
        } else if (e.key === 'ArrowLeft' && currentLevel > 0) {
            setLevel(currentLevel - 1);
        }
    });

    // INITIAL INITIALIZATION
    setLevel(0);
</script>
</body>
</html>
